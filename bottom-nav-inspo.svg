<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f0fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-6" stdDeviation="10" flood-color="#7754d1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="40" y="15" width="620" height="90" rx="28" fill="url(#bg)" filter="url(#shadow)" stroke="#eeeaf4"/>
  <!-- Home (active) -->
  <g transform="translate(110,30)">
    <rect x="-34" y="-6" width="68" height="76" rx="18" fill="#7754d1" opacity="0.12"/>
    <text x="0" y="26" text-anchor="middle" font-size="24" fill="#7754d1">⌂</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#7754d1" font-family="sans-serif">Home</text>
  </g>
  <!-- Categories -->
  <g transform="translate(260,30)">
    <text x="0" y="26" text-anchor="middle" font-size="24" fill="#9693a3">▦</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#9693a3" font-family="sans-serif">Categories</text>
  </g>
  <!-- Favorites -->
  <g transform="translate(410,30)">
    <text x="0" y="26" text-anchor="middle" font-size="24" fill="#9693a3">♡</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#9693a3" font-family="sans-serif">Favorites</text>
  </g>
  <!-- Profile -->
  <g transform="translate(560,30)">
    <text x="0" y="26" text-anchor="middle" font-size="24" fill="#9693a3">◯</text>
    <text x="0" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#9693a3" font-family="sans-serif">Profile</text>
  </g>
</svg>